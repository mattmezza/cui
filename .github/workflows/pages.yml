name: WebAssembly gallery and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build and browser tools
        run: |
          python -m pip install uv==0.10.8 ziglang==0.16.0
          uv run --with playwright==1.58.0 playwright install --with-deps chromium
      - name: Build actual CUI WebAssembly gallery
        run: python scripts/build_web.py --zig "$(python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
      - name: Verify complete static sharing metadata
        run: python tests/test_sharing.py
      - name: Exercise component behavior in Chromium
        run: uv run tests/web/test_browser.py
      - name: Verify real touch contacts scrolling and opt-in pinch
        run: uv run tests/web/test_touch.py
      - name: Verify native IME composition in built-in text consumers
        run: uv run tests/web/test_ime.py
      - name: Verify numeric OTP and combobox native composition
        run: uv run tests/web/test_ime_additional.py
      - name: Audit representative touch behavior across the catalog
        run: uv run tests/web/test_touch_components.py
      - name: Verify additional touch controls and actual clipboard
        run: uv run tests/web/test_touch_more.py
      - name: Verify mobile page swipe fallback and control ownership
        run: uv run tests/web/test_touch_page_navigation.py
      - name: Verify interaction guides design controls and composed app
        run: uv run tests/web/test_site_extensions.py
      - name: Check reported gallery geometry regressions
        run: uv run tests/web/test_visual_regressions.py
      - name: Upload static gallery
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified gallery
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
