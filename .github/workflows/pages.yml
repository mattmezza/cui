name: WebAssembly gallery and GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gallery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned build and browser tools
        run: |
          python -m pip install uv==0.10.8 ziglang==0.16.0
          python -c 'import os, pathlib, ziglang; pathlib.Path(os.environ["GITHUB_PATH"]).open("a").write(str(pathlib.Path(ziglang.__file__).parent) + "\n")'
          uv run --with playwright==1.58.0 playwright install --with-deps chromium
      - name: Build actual CUI WebAssembly gallery
        run: python scripts/build_web.py --zig "$(python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
      - name: Verify complete static sharing metadata
        run: python tests/test_sharing.py
      - name: Exercise component behavior in Chromium
        run: uv run tests/web/test_browser.py
      - name: Verify real touch contacts scrolling and opt-in pinch
        run: uv run tests/web/test_touch.py
      - name: Verify native IME composition in built-in text consumers
        run: uv run tests/web/test_ime.py
      - name: Gallery source shadow pixels and atomic preflight
        run: uv run tests/web/test_shadow_gallery.py
      - name: Gallery controlled joined button collections
        run: uv run tests/web/test_button_collection_gallery.py
      - name: Gallery password modes and secure host bridge
        run: uv run tests/web/test_password_gallery.py
      - name: Verify live Input whole-value acceptance and guide links
        run: uv run tests/web/test_input_acceptance_gallery.py
      - name: Verify numeric OTP and combobox native composition
        run: uv run tests/web/test_ime_additional.py
      - name: Audit representative touch behavior across the catalog
        run: uv run tests/web/test_touch_components.py
      - name: Verify additional touch controls and actual clipboard
        run: uv run tests/web/test_touch_more.py
      - name: Verify mobile page swipe fallback and control ownership
        run: uv run tests/web/test_touch_page_navigation.py
      - name: Verify visible pane resizing across desktop mobile and touch
        run: uv run tests/web/test_resizable_drag.py --directory build/web
      - name: Verify interaction guides design controls and composed app
        run: uv run tests/web/test_site_extensions.py
      - name: Check reported gallery geometry regressions
        run: uv run tests/web/test_visual_regressions.py
      - name: Verify Tabs nested wheel and touch event ownership
        run: uv run tests/web/test_tabs_scroll_chaining.py
      - name: Verify expanded design sizes and tab overflow
        run: uv run tests/web/test_design_sizes.py
      - name: Verify localized date and year selection
        run: uv run tests/web/test_date_locale_year.py
      - name: Verify sidebar icon clipping
        run: uv run tests/web/test_sidebar_clipping.py
      - name: Verify toolbar title bar and hover card examples
        run: uv run tests/web/test_example_polish.py
      - name: Verify Plot mouse and touch viewport interactions
        run: uv run tests/web/test_plot_interactions.py
      - name: Verify portrait stacks and compact conversation touch behavior
        run: uv run tests/web/test_avatar_message.py
      - name: Verify shared scrollbar appearance and idle hiding
        run: uv run tests/web/test_scrollbar_appearance.py
      - name: Verify controlled radio groups and touch cancellation
        run: uv run tests/web/test_radio_group.py
      - name: Verify attachment sizes and visible metadata
        run: uv run tests/web/test_attachment_sizes.py
      - name: Verify responsive content and large type containment
        run: uv run tests/web/test_responsive_gallery.py
      - name: Verify Checkbox motion wrapping and help behavior
        run: uv run tests/web/test_checkbox_motion.py
      - name: Verify semantic alerts and aligned reaction slots
        run: uv run tests/web/test_alert_bubble_slots.py
      - name: Verify caller-clocked loading motion and reduced-motion quiescence
        run: uv run tests/web/test_status_motion.py
      - name: Verify disabled and loading Button activation barriers
        run: |
          uv run tests/web/test_button_activation_blocker.py
          uv run tests/web/test_button_blocker_scroll_scope.py
      - name: Verify Button callbacks slots focus and painted states
        run: uv run tests/web/test_button_behavior.py
      - name: Verify Table sizing and selection-only DataTable actions
        run: uv run tests/web/test_table_selection_contracts.py
      - name: Verify Chart appearance and stationary hover gating
        run: |
          uv run tests/web/test_chart_appearance_hover.py
          uv run tests/web/test_chart_appearance_hover.py --controlled-clock
      - name: Verify pointer presence capture and actual gallery leave behavior
        run: uv run tests/web/test_pointer_presence.py --directory build/web
      - name: Verify copied Chart tooltip rows with actual WASM pixels
        run: |
          uv run tests/web/test_chart_typed_tooltip.py
          uv run tests/web/test_chart_tooltip_gallery.py
          uv run tests/web/test_chart_tooltip_appearance.py
          uv run tests/web/test_chart_appearance_gallery.py
      - name: Verify Radar custom-label tooltip titles with actual WASM pixels
        run: uv run tests/web/test_chart_radar_tooltip_title.py
      - name: Verify source point-axis geometry with actual WASM pixels
        run: uv run tests/web/test_chart_source_point_axis.py
      - name: Verify current-frame Chart and Plot geometry and tooltip pixels
        run: uv run tests/web/test_plot_chart_prepaint.py
      - name: Verify current-frame prepaint clipping and pointer occlusion
        run: uv run tests/web/test_core_prepaint.py
      - name: Verify independent Plot and Chart motion policies
        run: uv run tests/web/test_plot_chart_owner_motion.py
      - name: Verify portable theme host preferences with real browser events
        run: uv run tests/web/test_theme_registry.py
      - name: Upload static gallery
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/web
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified gallery
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
