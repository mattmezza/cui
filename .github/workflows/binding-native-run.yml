name: Native binding callback runners
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-native-binding-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.8.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.6'
          cache: false
      - name: Install hosted-runner build and invisible-display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb xauth xdotool
          rustup toolchain install 1.85.1 --profile minimal
      - name: Configure private dependency paths
        # runner is unavailable in job-level env expressions.
        run: |
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/cui-run-deps/lib/pkgconfig" >> "$GITHUB_ENV"
          # The validator removes LD_LIBRARY_PATH; embed the ELF search path.
          echo "LD_RUN_PATH=$RUNNER_TEMP/cui-run-deps/lib" >> "$GITHUB_ENV"
      - name: Reject stale embedded SDKs before native builds
        run: |
          python tests/test_binding_run_workflow.py
          python scripts/generate_go_sdk.py --check
      - name: Build checksum-pinned SDL, FreeType and HarfBuzz
        run: |
          cmake -S tools/native-deps -B "$RUNNER_TEMP/cui-run-deps-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCUI_DEPS_PREFIX="$RUNNER_TEMP/cui-run-deps" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath,$RUNNER_TEMP/cui-run-deps/lib"
          cmake --build "$RUNNER_TEMP/cui-run-deps-build" --parallel 4
          python tests/test_native_deps.py --prefix "$RUNNER_TEMP/cui-run-deps"
      - name: Build required native bridge without sanitizers
        run: |
          cmake -S . -B "$RUNNER_TEMP/cui-run-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCUI_BUILD_NATIVE=ON -DCUI_REQUIRE_NATIVE=ON \
            -DCUI_BUILD_BRIDGE=ON -DCUI_SANITIZE=OFF \
            -DCMAKE_BUILD_RPATH="$RUNNER_TEMP/cui-run-deps/lib" \
            -DCUI_TEST_FONT="$PWD/third_party/inter/Inter-Regular.otf"
          cmake --build "$RUNNER_TEMP/cui-run-native" --target cui_bridge --parallel 4
      - name: Validate all ten static and dynamic callback cases in private Xvfb
        # This script stages modules outside the checkout, builds offline, and
        # invokes scripts/test_local.py itself. Never provide a desktop DISPLAY.
        run: |
          node_include="$(dirname "$(dirname "$(command -v node)")")/include/node"
          test -f "$node_include/node_api.h"
          rustup run 1.85.1 python scripts/test_binding_run.py \
            --source-root "$PWD" --build-dir "$RUNNER_TEMP/cui-binding-run" \
            --library "$RUNNER_TEMP/cui-run-native/libcui_bridge.so" \
            --font "$PWD/third_party/inter/Inter-Regular.otf" \
            --node-include "$node_include" --mode all
