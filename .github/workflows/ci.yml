name: CUI build and evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: cmake -S . -B build -DCUI_BUILD_NATIVE=OFF -DCUI_BUILD_BRIDGE=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --config ${{ matrix.build_type }}
      - run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure
  linux-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libfreetype-dev libharfbuzz-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev xvfb
      # SDL is a FetchContent subproject: its install rules default to disabled.
      # Configure the final prefix up front so its pkg-config metadata and loader
      # paths agree with the independently built, extracted source consumer.
      - run: cmake -S . -B build -G Ninja -DCUI_FETCH_SDL=ON -DCUI_SANITIZE=ON -DSDL_INSTALL=ON -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/native-deps"
      - run: cmake --build build
      - name: Expose pinned SDL to the standalone bundle consumer
        run: |
          if [ -d build/_deps/sdl-build ]; then
            cmake --install build/_deps/sdl-build --prefix "$RUNNER_TEMP/native-deps"
          fi
          PKG_CONFIG_PATH="$RUNNER_TEMP/native-deps/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" \
            pkg-config --print-errors --exists 'sdl3 >= 3.2' freetype2 harfbuzz
      - name: Test with an isolated display, including extracted native bundle
        run: python scripts/test_local.py --build-dir build
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/native-deps/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ runner.temp }}/native-deps/lib
      - name: X11 compatibility smoke (software forced; GPU unverified)
        run: xvfb-run -a env SDL_RENDER_DRIVER=software ./build/cui_gallery --smoke 3
      - name: Independent Sokol OpenGL pixel readback (actual driver reported)
        run: xvfb-run -a ./build/test_sokol
  macos-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build pinned native dependencies
        run: |
          cmake -S tools/native-deps -B build/macos-deps -DCMAKE_BUILD_TYPE=Release -DCUI_DEPS_PREFIX="$RUNNER_TEMP/cui-native-deps"
          cmake --build build/macos-deps --parallel 4
          python tests/test_native_deps.py --prefix "$RUNNER_TEMP/cui-native-deps"
      - name: Configure required native adapters and bundled starter
        env:
          PKG_CONFIG_PATH: ${{ runner.temp }}/cui-native-deps/lib/pkgconfig
        run: >-
          cmake -S . -B build/macos -DCMAKE_BUILD_TYPE=Release
          -DCUI_REQUIRE_NATIVE=ON -DCUI_BUILD_NATIVE_STARTER=ON
          -DCUI_HEADLESS_NATIVE_TESTS=ON -DCUI_BUILD_CPP_EXAMPLE=OFF
          -DCUI_TEST_FONT="$PWD/third_party/inter/Inter-Regular.otf"
          -DCUI_MACOS_DEPENDENCY_LICENSE_DIR="$RUNNER_TEMP/cui-native-deps/share/licenses"
      - run: cmake --build build/macos --parallel 4
      - name: Headless native adapter checks (Cocoa and Metal acceptance deferred)
        env:
          CUI_TEST_FONT: ${{ github.workspace }}/third_party/inter/Inter-Regular.otf
          CUI_TEST_FAMILY_FONT: ${{ github.workspace }}/third_party/inter/Inter-Bold.otf
        run: python scripts/test_local.py --build-dir build/macos
      - name: Deploy and verify installed application without opening a window
        run: |
          cmake --install build/macos --prefix "$RUNNER_TEMP/cui-native-installed"
          python tests/packaging/verify_macos_app.py "$RUNNER_TEMP/cui-native-installed/cui_native_starter.app"
          tar -czf "$RUNNER_TEMP/cui-native-macos.tar.gz" -C "$RUNNER_TEMP/cui-native-installed" cui_native_starter.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-development-app
          path: ${{ runner.temp }}/cui-native-macos.tar.gz
          if-no-files-found: error

  distribution-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install clang-format==23.1.2
      - run: python scripts/format.py --check
      - run: python scripts/check_manifest.py
      - run: python scripts/test_release_metadata.py --tag v0.1.0-alpha.2
      - run: python scripts/test_release_metadata.py --self-test
      - run: python scripts/check_licenses.py
      - run: python scripts/amalgamate.py --check
      - run: python tests/test_test_runner.py

  agent-skill:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check generated resources and offline installed-skill workflows
        run: |
          python scripts/generate_agent_skill.py --check
          python tests/test_agent_skill.py

  node-builders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.8.0'
      - run: cmake -S bindings/node -B build-node -DCUI_BUILD_NATIVE=OFF
      - run: cmake --build build-node --target cui_node_bindings test_bridge_core test_bridge_components cui_notification_v1_fixture cui_value_notification_fixture
      - run: python scripts/test_local.py --build-dir build-node -R '^(bridge_|node_)'
      - run: node bindings/node/examples/save.cjs --headless
      - run: node bindings/node/examples/workspace.cjs --headless
      - run: npm exec --yes --package typescript@5.8.3 -- tsc --noEmit --strict --target ES2022 bindings/typescript/components.typecheck.ts
      - run: npm exec --yes --package typescript@5.8.3 -- tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext bindings/node/test/notifications-v1.types.ts bindings/node/test/value-notifications-v1.types.ts
      - run: node bindings/typescript/examples/save.ts --headless

  installed-binding-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '25.8.0'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.6'
          cache: false
      - run: rustup toolchain install 1.85.1 --profile minimal
      - name: Reject stale generated Go and Rust SDK sources
        run: python scripts/generate_go_sdk.py --check
      - name: Build installable Python and prebuilt npm artifacts
        run: |
          python scripts/package_bindings.py python --output build/packages/dynamic
          python scripts/package_bindings.py node --prebuilt --output build/packages/dynamic
      - name: Install outside the checkout with native build tools blocked
        run: python scripts/test_binding_packages.py --artifacts build/packages/dynamic --require-prebuilt
      - name: Exercise installed addon on pinned Node 18 and 22 runtimes
        run: python scripts/test_node_package_runtimes.py --tarball build/packages/dynamic/cui-native-0.1.0-alpha.2.tgz --cache-dir ${{ runner.temp }}/cui-node-runtime-validation
      - name: Build embedded Go, public source Go and static Rust artifacts
        run: |
          python scripts/package_bindings.py go --prebuilt --output build/packages/go-embedded
          python scripts/package_bindings.py go --source-only --output build/packages/go-source
          rustup run 1.85.1 python scripts/package_bindings.py rust --output build/packages/rust
      - name: Execute clean Go and Rust consumers after removing build sources
        run: |
          rustup run 1.85.1 python scripts/test_compiled_binding_packages.py --go-artifacts build/packages/go-embedded --rust-artifacts build/packages/rust
          rustup run 1.85.1 python scripts/test_compiled_binding_packages.py --go-artifacts build/packages/go-source --rust-artifacts build/packages/rust

  optional-regex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prepare checksum-verified private optional toolchain
        run: python scripts/prepare_regex_toolchain.py --cache build/regex-toolchain
      - name: Build pinned optional provider offline
        run: python scripts/build_regex.py --cache build/regex-native --toolchain build/regex-toolchain/rust-1.85.1
      - name: Regex source oracle and fallible allocation boundaries
        run: CARGO_HOME="$PWD/build/regex-native/cargo" RUSTC="$PWD/build/regex-toolchain/rust-1.85.1/bin/rustc" build/regex-toolchain/rust-1.85.1/bin/cargo test --offline --locked --release --manifest-path build/regex-native/source/Cargo.toml --target-dir build/regex-native/target -- --test-threads=1
      - run: cmake -S . -B build/native -DCUI_BUILD_NATIVE=OFF -DCUI_BUILD_REGEX=ON -DCUI_REGEX_LIBRARY=${{ github.workspace }}/build/regex-native/target/release/libcui_regex.a
      - run: cmake --build build/native
      - run: ctest --test-dir build/native --output-on-failure

  go-rust-builders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23.6'
          cache: false
      - run: rustup toolchain install 1.85.1 --profile minimal
      - run: cmake -S . -B build -DCUI_BUILD_NATIVE=OFF -DCUI_BUILD_BRIDGE=ON
      - run: cmake --build build --target cui_bridge test_bridge_core test_bridge_components test_bridge_portable_run test_bridge_notifications test_bridge_value_notifications test_bridge_text_notifications test_bridge_selection_notifications
      - run: python scripts/test_local.py --build-dir build -R '^bridge_'
      - name: Real Go component state and callback tests
        working-directory: bindings/go
        env:
          CUI_BRIDGE_LIBRARY: ${{ github.workspace }}/build/libcui_bridge.so
        run: go test -v ./...
      - run: cd bindings/go && go vet ./...
      - name: Real Rust component state and callback tests
        env:
          CUI_BRIDGE_LIB_DIR: ${{ github.workspace }}/build
        run: cargo +1.85.1 test --offline --locked --manifest-path bindings/rust/Cargo.toml -- --test-threads=1
      - name: Composed Rust workspace interaction
        env:
          CUI_BRIDGE_LIB_DIR: ${{ github.workspace }}/build
        run: cargo +1.85.1 run --offline --locked --manifest-path bindings/rust/Cargo.toml --example workspace -- --headless
